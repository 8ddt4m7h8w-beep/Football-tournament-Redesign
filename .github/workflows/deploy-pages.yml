name: Deploy tournament to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check HTML references
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const ids = new Set([...html.matchAll(/\\bid=["']([^"']+)["']/g)].map(m => m[1]));
          const refs = [...js.matchAll(/getElementById\\(["']([^"']+)["']\\)/g)].map(m => m[1]);
          const generated = new Set(['eventForm', 'eventType', 'eventPlayer', 'eventMinute']);
          const missing = [...new Set(refs)].filter(id => !ids.has(id) && !generated.has(id));
          if (missing.length) { console.error('Missing HTML ids:', missing.join(', ')); process.exit(1); }
          console.log('HTML references OK');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
